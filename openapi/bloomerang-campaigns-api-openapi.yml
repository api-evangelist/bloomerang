                        Do not compare or add Raised figures that carry different modes, and say which basis you used when reporting a total. If this field is absent the number came from a cached summary written before the mode was recorded, and which formula produced it is unknown.'
                - allOf:
                  - type: object
                    properties:
                      StartDate:
                        type: string
                        format: date
                      EndDate:
                        type: string
                        format: date
                      Goal:
                        type: number
                        format: currency
                - properties:
                    Name:
                      type: string
                    SortIndex:
                      type: integer
                      format: int32
                    IsActive:
                      type: boolean
                      description: Is this active?
                - type: object
                  properties:
                    AuditTrail:
                      properties:
                        CreatedDate:
                          type: string
                          format: date-time
                        CreatedName:
                          type: string
                        LastModifiedDate:
                          type: string
                          format: date-time
                        LastModifiedName:
                          type: string
      operationId: getCampaignById
      x-operation-id-source: derived
    put:
      tags:
      - Campaigns
      summary: Updates a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
                    format: int64
              - allOf:
                - type: object
                  properties:
                    StartDate:
                      type: string
                      format: date
                    EndDate:
                      type: string
                      format: date
                    Goal:
                      type: number
                      format: currency
              - properties:
                  Name:
                    type: string
                  IsActive:
                    type: boolean
                    description: Is this active?
                  SortIndex:
                    type: integer
                    format: int32
      responses:
        '200':
          description: The campaign with the given ID.
          content:
