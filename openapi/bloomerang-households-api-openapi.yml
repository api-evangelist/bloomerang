openapi: 3.2.0
info:
  title: Bloomerang Households API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Households
paths:
  /constituents/search:
    get:
      tags:
      - Households
      summary: Searches for constituents and households
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: search
        schema:
          type: string
        description: The text to search
      - in: query
        name: type
        schema:
          type: string
          enum:
          - Individual
          - Organization
          - Household
        description: Filters individuals, organizations, and households
      responses:
        '200':
          description: The list of constituents and households that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        oneOf:
                        - allOf:
                          - type: object
                            properties:
                              Id:
                                type: integer
                                format: int64
                                description: The ID of the constituent used in the API (not to be confused with AccountNumber)
                              AccountNumber:
                                type: integer
                                format: int64
                                description: A user-friendly account number used in the Bloomerang CRM UI (not to be confused with ID).
                              IsInHousehold:
                                type: boolean
                                description: Whether the Constituent is in a household
                              IsHeadOfHousehold:
                                type: boolean
                                description: Whether the Constituent is in a household and is marked as the primary
                              IsFavorite:
                                type: boolean
                                description: True if this constituent is a favorite of the current user
                              FullCustomProfileImageId:
                                type: integer
                                format: int64
                                description: The ID of the existing file attachment for the full version of the custom profile image.
                              FullCustomProfileImageUrl:
                                type: string
                                format: url
                                description: The URL of the existing file attachment for the full version of the custom profile image.
                              CroppedCustomProfileImageId:
                                type: integer
                                format: int64
                                description: The ID of the existing file attachment for the cropped version of the custom profile image.
                              CroppedCustomProfileImageUrl:
                                type: string
                                format: url
                                description: The URL of the existing file attachment for the cropped version of the custom profile image.
                          - properties:
                              Type:
                                type: string
                                enum:
                                - Individual
                                - Organization
                              Status:
                                type: string
                                enum:
                                - Active
                                - Inactive
                                - Deceased
                              FirstName:
                                type: string
                              LastName:
                                type: string
                              MiddleName:
                                type: string
                              Prefix:
                                type: string
                                description: Must match a prefix in the Bloomerang CRM
                              Suffix:
                                type: string
                                description: Must match a suffix in the Bloomerang CRM
                              FullName:
                                type: string
                              InformalName:
                                type: string
                              FormalName:
                                type: string
                              EnvelopeName:
                                type: string
                              RecognitionName:
                                type: string
                              JobTitle:
                                type: string
                              Employer:
                                type: string
                              Website:
                                type: string
                                format: uri
                              FacebookId:
                                type: string
                              TwitterId:
                                type: string
                              LinkedInId:
                                type: string
                              Gender:
                                type: string
                                enum:
                                - Male
                                - Female
                                - Other
                              Birthdate:
                                type: string
                                format: date
                              ProfilePictureType:
                                type: string
                                enum:
                                - None
                                - Custom
                                - Twitter
                          - type: object
                            properties:
                              HouseholdId:
                                type: integer
                                format: int64
                                description: The ID of the household this constituent is in (not to be confused with AccountNumber)
                              PreferredCommunicationChannel:
                                type: string
                                enum:
                                - Email
                                - Phone
                                - TextMessage
                                - Mail
                              CommunicationRestrictions:
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - DoNotCall
                                  - DoNotMail
                                  - DoNotSolicit
                              CommunicationRestrictionsUpdateReason:
                                type: string
                                description: The most-recent reason for updating this constituent's communication restrictions
                              EmailInterestType:
                                type: string
                                enum:
                                - All
                                - Custom
                                - OptedOut
                              CustomEmailInterests:
                                type: array
                                items:
                                  properties:
                                    Id:
                                      type: integer
                                      format: int64
                                      description: The ID of the object
                                    Name:
                                      type: string
                                description: IDs for custom email interests if the email interest type is Custom
                              EmailInterestsUpdateReason:
                                type: string
                                description: The most-recent reason for updating this constituent's email interests
                              PrimaryAddress:
                                allOf:
                                - type: object
                                  properties:
                                    Id:
                                      type: integer
                                      format: int64
                                    AccountId:
                                      type: integer
                                      format: int64
                                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                    Type:
                                      type: string
                                      enum:
                                      - Home
                                      - Vacation
                                      - Work
                                    Street:
                                      type: string
                                    City:
                                      type: string
                                    State:
                                      type: string
                                      description: Must match a state in the Bloomerang CRM
                                    PostalCode:
                                      type: string
                                    Country:
                                      type: string
                                      description: Must match a state in the Bloomerang CRM
                                    IsPrimary:
                                      type: boolean
                                    IsBad:
                                      type: boolean
                                - type: object
                                  properties:
                                    AuditTrail:
                                      properties:
                                        CreatedDate:
                                          type: string
                                          format: date-time
                                        CreatedName:
                                          type: string
                                        LastModifiedDate:
                                          type: string
                                          format: date-time
                                        LastModifiedName:
                                          type: string
                                - type: object
                                  properties:
                                    StateAbbreviation:
                                      type: string
                                      description: The 2-3 letter abbreviation for the state/province
                                    CountryCode:
                                      type: string
                                      description: The 2 letter ISO code for the country
                              PrimaryEmail:
                                allOf:
                                - type: object
                                  properties:
                                    Id:
                                      type: integer
                                      format: int64
                                    AccountId:
                                      type: integer
                                      format: int64
                                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                    Type:
                                      type: string
                                      enum:
                                      - Home
                                      - Work
                                    Value:
                                      type: string
                                      format: email
                                      description: The email address
                                    IsPrimary:
                                      type: boolean
                                    IsBad:
                                      type: boolean
                                - type: object
                                  properties:
                                    AuditTrail:
                                      properties:
                                        CreatedDate:
                                          type: string
                                          format: date-time
                                        CreatedName:
                                          type: string
                                        LastModifiedDate:
                                          type: string
                                          format: date-time
                                        LastModifiedName:
                                          type: string
                              PrimaryPhone:
                                allOf:
                                - type: object
                                  properties:
                                    Id:
                                      type: integer
                                      format: int64
                                    AccountId:
                                      type: integer
                                      format: int64
                                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                    Type:
                                      type: string
                                      enum:
                                      - Home
                                      - Work
                                      - Mobile
                                      - Fax
                                    Extension:
                                      type: string
                                    Number:
                                      type: string
                                      format: phone
                                      description: The phone number including formatting but not the extension
                                    IsPrimary:
                                      type: boolean
                                properties:
                                  AuditTrail:
                                    properties:
                                      CreatedDate:
                                        type: string
                                        format: date-time
                                      CreatedName:
                                        type: string
                                      LastModifiedDate:
                                        type: string
                                        format: date-time
                                      LastModifiedName:
                                        type: string
                              EngagementScore:
                                type: string
                                enum:
                                - Low
                                - MediumLow
                                - Medium
                                - MediumHigh
                                - High
                              EngagementScoreLabel:
                                type: string
                                description: The display label for the constituent's Engagement Score (e.g. Cold, Cool, Warm, Hot, On Fire!, Not Scanned)
                              DonorSearchInfo:
                                properties:
                                  Id:
                                    type: integer
                                    format: int64
                                  GenerosityScore:
                                    type: string
                                    enum:
                                    - Low
                                    - MediumLow
                                    - Medium
                                    - MediumHigh
                                    - High
                                    - NotScanned
                                  GenerosityScoreLabel:
                                    type: string
                                    description: The display label for the constituent's Generosity Score (e.g. Cold, Cool, Warm, Hot, On Fire!, Not Scanned)
                                  AnnualFundLikelihood:
                                    type: string
                                    enum:
                                    - Low
                                    - MediumLow
                                    - Medium
                                    - MediumHigh
                                    - High
                                    - NotScanned
                                  MajorGiftLikelihood:
                                    type: string
                                    enum:
                                    - Low
                                    - MediumLow
                                    - Medium
                                    - MediumHigh
                                    - High
                                    - NotScanned
                                  Quality:
                                    type: string
                                    enum:
                                    - Low
                                    - High
                                  LargestGiftMin:
                                    type: number
                                    format: currency
                                  LargestGiftMax:
                                    type: number
                                    format: currency
                                  WealthAskMin:
                                    type: number
                                    format: currency
                                  WealthAskMax:
                                    type: number
                                    format: currency
                                  BusinessExecutive:
                                    type: boolean
                                  NamesScreened:
                                    type: string
                                  DateTimeScreenedUtc:
                                    type: string
                                    format: datetime
                                  DemocraticContributionCount:
                                    type: integer
                                    format: int32
                                  RepublicanContributionCount:
                                    type: integer
                                    format: int32
                                  IndependentContributionCount:
                                    type: integer
                                    format: int32
                                  BusinessRevenues:
                                    type: number
                                    format: currency
                                  LargestGiftOrg:
                                    type: string
                                  TotalGiftAmount:
                                    type: number
                                    format: currency
                                  RealEstateCount:
                                    type: integer
                                    format: int32
                                  Foundations:
                                    type: string
                              AddressIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of the addresses including the primary address ID
                              EmailIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of the emails including the primary email ID
                              PhoneIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of the phones including the primary phone ID
                              CustomValues:
                                type: array
                                items:
                                  oneOf:
                                  - properties:
                                      FieldId:
                                        type: integer
                                        format: int64
                                      FieldText:
                                        type: string
                                        description: The label/text of the custom field
                                      Value:
                                        properties:
                                          Id:
                                            type: integer
                                            format: int64
                                          Value:
                                            type: string
                                  - properties:
                                      FieldId:
                                        type: integer
                                        format: int64
                                      FieldText:
                                        type: string
                                        description: The label/text of the custom field
                                      Values:
                                        type: array
                                        items:
                                          properties:
                                            Id:
                                              type: integer
                                              format: int64
                                            Value:
                                              type: string
                              AuditTrail:
                                properties:
                                  CreatedDate:
                                    type: string
                                    format: date-time
                                  CreatedName:
                                    type: string
                                  LastModifiedDate:
                                    type: string
                                    format: date-time
                                  LastModifiedName:
                                    type: string
                        - allOf:
                          - properties:
                              FullName:
                                type: string
                              SortName:
                                type: string
                              InformalName:
                                type: string
                              FormalName:
                                type: string
                              EnvelopeName:
                                type: string
                              RecognitionName:
                                type: string
                          - properties:
                              Id:
                                type: integer
                                format: int64
                                description: The ID of the household used in the API (not to be confused with AccountNumber)
                              AccountNumber:
                                type: integer
                                format: int64
                                description: A user-friendly account number used in the Bloomerang CRM UI (not to be confused with ID).
                              Type:
                                type: string
                                enum:
                                - Household
                              Status:
                                type: string
                                enum:
                                - Active
                                - Inactive
                                - Deceased
                              HeadId:
                                type: integer
                                format: int64
                                description: The ID of the head of household used in the API (not to be confused with AccountNumber)
                              MemberIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of the members of the household used in the API, including the head of household's ID (not to be confused with AccountNumber)
                              CommunicationRestrictions:
                                type: array
                                items:
                                  type: string
                                  enum:
                                  - DoNotCall
                                  - DoNotMail
                                  - DoNotSolicit
                              AuditTrail:
                                properties:
                                  CreatedDate:
                                    type: string
                                    format: date-time
                                  CreatedName:
                                    type: string
                                  LastModifiedDate:
                                    type: string
                                    format: date-time
                                  LastModifiedName:
                                    type: string
                              IsFavorite:
                                type: boolean
                                description: True if this constituent is a favorite of the current user
                              EngagementScore:
                                type: string
                                enum:
                                - Low
                                - MediumLow
                                - Medium
                                - MediumHigh
                                - High
      operationId: getConstituentsSearch
      x-operation-id-source: derived
  /households:
    get:
      tags:
      - Households
      summary: Gets a list of households
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: lastModified
        schema:
          type: string
          format: date-time
        description: Filters to households last modified after the specified date
      - in: query
        name: id
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters results based on the ID for the household.
      responses:
        '200':
          description: The list of households that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - properties:
                            FullName:
                              type: string
                            SortName:
                              type: string
                            InformalName:
                              type: string
                            FormalName:
                              type: string
                            EnvelopeName:
                              type: string
                            RecognitionName:
                              type: string
                        - properties:
                            Id:
                              type: integer
                              format: int64
                              description: The ID of the household used in the API (not to be confused with AccountNumber)
                            AccountNumber:
                              type: integer
                              format: int64
                              description: A user-friendly account number used in the Bloomerang CRM UI (not to be confused with ID).
                            Type:
                              type: string
                              enum:
                              - Household
                            Status:
                              type: string
                              enum:
                              - Active
                              - Inactive
                              - Deceased
                            HeadId:
                              type: integer
                              format: int64
                              description: The ID of the head of household used in the API (not to be confused with AccountNumber)
                            MemberIds:
                              type: array
                              items:
                                type: integer
                                format: int64
                              description: The IDs of the members of the household used in the API, including the head of household's ID (not to be confused with AccountNumber)
                            CommunicationRestrictions:
                              type: array
                              items:
                                type: string
                                enum:
                                - DoNotCall
                                - DoNotMail
                                - DoNotSolicit
                            AuditTrail:
                              properties:
                                CreatedDate:
                                  type: string
                                  format: date-time
                                CreatedName:
                                  type: string
                                LastModifiedDate:
                                  type: string
                                  format: date-time
                                LastModifiedName:
                                  type: string
                            IsFavorite:
                              type: boolean
                              description: True if this constituent is a favorite of the current user
                            EngagementScore:
                              type: string
                              enum:
                              - Low
                              - MediumLow
                              - Medium
                              - MediumHigh
                              - High
      operationId: getHouseholds
      x-operation-id-source: derived
  /household:
    post:
      tags:
      - Households
      summary: Creates a Household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - properties:
                    FullName:
                      type: string
                    SortName:
                      type: string
                    InformalName:
                      type: string
                    FormalName:
                      type: string
                    EnvelopeName:
                      type: string
                    RecognitionName:
                      type: string
                - properties:
                    Head:
                      description: Additional validation note - FirstName and LastName are required when Type is Individual.  FullName is required when Type is Organization.
                      allOf:
                      - properties:
                          Type:
                            type: string
                            enum:
                            - Individual
                            - Organization
                          Status:
                            type: string
                            enum:
                            - Active
                            - Inactive
                            - Deceased
                          FirstName:
                            type: string
                          LastName:
                            type: string
                          MiddleName:
                            type: string
                          Prefix:
                            type: string
                            description: Must match a prefix in the Bloomerang CRM
                          Suffix:
                            type: string
                            description: Must match a suffix in the Bloomerang CRM
                          FullName:
                            type: string
                          InformalName:
                            type: string
                          FormalName:
                            type: string
                          EnvelopeName:
                            type: string
                          RecognitionName:
                            type: string
                          JobTitle:
                            type: string
                          Employer:
                            type: string
                          Website:
                            type: string
                            format: uri
                          FacebookId:
                            type: string
                          TwitterId:
                            type: string
                          LinkedInId:
                            type: string
                          Gender:
                            type: string
                            enum:
                            - Male
                            - Female
                            - Other
                          Birthdate:
                            type: string
                            format: date
                          ProfilePictureType:
                            type: string
                            enum:
                            - None
                            - Custom
                            - Twitter
                      - type: object
                        properties:
                          PrimaryAddress:
                            type: object
                            properties:
                              Id:
                                type: integer
                                format: int64
                              AccountId:
                                type: integer
                                format: int64
                                description: The ID of the constituent used in the API (not to be confused with accountNumber)
                              Type:
                                type: string
                                enum:
                                - Home
                                - Vacation
                                - Work
                              Street:
                                type: string
                              City:
                                type: string
                              State:
                                type: string
                                description: Must match a state in the Bloomerang CRM
                              PostalCode:
                                type: string
                              Country:
                                type: string
                                description: Must match a state in the Bloomerang CRM
                              IsPrimary:
                                type: boolean
                              IsBad:
                                type: boolean
                          SecondaryAddresses:
                            type: array
                            items:
                              type: object
                              properties:
                                Id:
                                  type: integer
                                  format: int64
                                AccountId:
                                  type: integer
                                  format: int64
                                  description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                Type:
                                  type: string
                                  enum:
                                  - Home
                                  - Vacation
                                  - Work
                                Street:
                                  type: string
                                City:
                                  type: string
                                State:
                                  type: string
                                  description: Must match a state in the Bloomerang CRM
                                PostalCode:
                                  type: string
                                Country:
                                  type: string
                                  description: Must match a state in the Bloomerang CRM
                                IsPrimary:
                                  type: boolean
                                IsBad:
                                  type: boolean
                            description: Non-primary addresses
                          PrimaryEmail:
                            type: object
                            properties:
                              Id:
                                type: integer
                                format: int64
                              AccountId:
                                type: integer
                                format: int64
                                description: The ID of the constituent used in the API (not to be confused with accountNumber)
                              Type:
                                type: string
                                enum:
                                - Home
                                - Work
                              Value:
                                type: string
                                format: email
                                description: The email address
                              IsPrimary:
                                type: boolean
                              IsBad:
                                type: boolean
                          SecondaryEmails:
                            type: array
                            items:
                              type: object
                              properties:
                                Id:
                                  type: integer
                                  format: int64
                                AccountId:
                                  type: integer
                                  format: int64
                                  description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                Type:
                                  type: string
                                  enum:
                                  - Home
                                  - Work
                                Value:
                                  type: string
                                  format: email
                                  description: The email address
                                IsPrimary:
                                  type: boolean
                                IsBad:
                                  type: boolean
                            description: Non-primary email addresses
                          PrimaryPhone:
                            allOf:
                            - type: object
                              properties:
                                Id:
                                  type: integer
                                  format: int64
                                AccountId:
                                  type: integer
                                  format: int64
                                  description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                Type:
                                  type: string
                                  enum:
                                  - Home
                                  - Work
                                  - Mobile
                                  - Fax
                                Extension:
                                  type: string
                                Number:
                                  type: string
                                  format: phone
                                  description: The phone number including formatting but not the extension
                                IsPrimary:
                                  type: boolean
                            properties:
                              AuditTrail:
                                properties:
                                  CreatedDate:
                                    type: string
                                    format: date-time
                                  CreatedName:
                                    type: string
                                  LastModifiedDate:
                                    type: string
                                    format: date-time
                                  LastModifiedName:
                                    type: string
                          SecondaryPhones:
                            type: array
                            items:
                              allOf:
                              - type: object
                                properties:
                                  Id:
                                    type: integer
                                    format: int64
                                  AccountId:
                                    type: integer
                                    format: int64
                                    description: The ID of the constituent used in the API (not to be confused with accountNumber)
                                  Type:
                                    type: string
                                    enum:
                                    - Home
                                    - Work
                                    - Mobile
                                    - Fax
                                  Extension:
                                    type: string
                                  Number:
                                    type: string
                                    format: phone
                                    description: The phone number including formatting but not the extension
                                  IsPrimary:
                                    type: boolean
                              properties:
                                AuditTrail:
                                  properties:
                                    CreatedDate:
                                      type: string
                                      format: date-time
                                    CreatedName:
                                      type: string
                                    LastModifiedDate:
                                      type: string
                                      format: date-time
                                    LastModifiedName:
                                      type: string
                            description: Non-primary phones
                          FullCustomProfileImage:
                            items:
                              oneOf:
                              - allOf:
                                - properties:
                                    Guid:
                                      type: string
                                      description: The GUID of the object uploaded to S3. This should be generated by the client that is uploading the file attachment.
                                - description: Validation notes - URL is required.  If creating attachments directly via the attachments endpoint (as opposed to including them a nested objects within other models), ParentType and ParentId are required.
                                  properties:
                                    Name:
                                      type: string
                                      description: User-friendly file name without the extension.
