                              type: integer
                              format: int64
                            ValueIds:
                              type: array
                              items:
                                type: integer
                                format: int64
                              description: The ID of the pick value to assign; an empty array clears the field
                    Attachments:
                      type: array
                      items:
                        oneOf:
                        - allOf:
                          - properties:
                              Guid:
                                type: string
                                description: The GUID of the object uploaded to S3. This should be generated by the client that is uploading the file attachment.
                          - description: Validation notes - URL is required.  If creating attachments directly via the attachments endpoint (as opposed to including them a nested objects within other models), ParentType and ParentId are required.
                            properties:
                              Name:
                                type: string
                                description: User-friendly file name without the extension.
                              Extension:
                                type: string
                                description: No dot needed (use "txt" instead of ".txt"). May be null if the attachment is just a URL.
                          - properties:
                              Url:
                                type: string
                                format: uri
                                description: If the file is stored in Bloomerang (not just a URL), this URL will only be good for 24 hours
                        - allOf:
                          - properties:
                              Id:
                                type: integer
                                format: int64
                          - description: Validation notes - URL is required.  If creating attachments directly via the attachments endpoint (as opposed to including them a nested objects within other models), ParentType and ParentId are required.
                            properties:
                              Name:
                                type: string
                                description: User-friendly file name without the extension.
                              Extension:
                                type: string
                                description: No dot needed (use "txt" instead of ".txt"). May be null if the attachment is just a URL.
                          - properties:
                              Url:
                                type: string
                                format: uri
                                description: If the file is stored in Bloomerang (not just a URL), this URL will only be good for 24 hours
              required:
              - Date
              - Channel
              - Purpose
              - Subject
      responses:
        '200':
          description: The interaction was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - properties:
                    Date:
                      type: string
                      format: date
                    Note:
                      type: string
                    Channel:
                      type: string
                      enum:
                      - Email
