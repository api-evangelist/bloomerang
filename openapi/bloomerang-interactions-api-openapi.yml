                      - ImpactCultivation
                      - Newsletter
                      - Receipt
                      - Solicitation
                      - SpecialEvent
                      - VolunteerActivity
                      - PledgeReminder
                      - Welcome
                      - BenevonPointOfEntry
                      - BenevonFollowUp
                      - BenevonAskEvent
                      - BenevonOneOnOneAsk
                      - BenevonOngoingCultivation
                      - Other
                    Subject:
                      type: string
                    IsInbound:
                      type: boolean
                - type: object
                  properties:
                    CustomValues:
                      type: array
                      items:
                        oneOf:
                        - properties:
                            FieldId:
                              type: integer
                              format: int64
                            Value:
                              type: string
                              description: The value to assign; null clears the field
                        - properties:
                            FieldId:
                              type: integer
                              format: int64
                            ValueId:
                              type: integer
                              format: int64
                              description: The ID of the pick value to assign; null clears the field
