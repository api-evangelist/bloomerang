openapi: 3.2.0
info:
  title: Bloomerang Interactions API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Interactions
paths:
  /interactions:
    get:
      tags:
      - Interactions
      summary: Gets a list of interactions
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: channel
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Email
            - MassEmail
            - Phone
            - TextMessage
            - Mail
            - InPerson
            - SocialMedia
            - Website
            - Twitter
            - Other
            - EngagementSurveyEmail
            - EngagementSurvey
        description: Filters results based on the interaction's channel.
      - in: query
        name: purpose
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - Acknowledgement
            - ImpactCultivation
            - Newsletter
            - Receipt
            - Solicitation
            - SpecialEvent
            - VolunteerActivity
            - PledgeReminder
            - Welcome
            - BenevonPointOfEntry
            - BenevonFollowUp
            - BenevonAskEvent
            - BenevonOneOnOneAsk
            - BenevonOngoingCultivation
            - Other
        description: Filters results based on the interaction's purpose.
      - in: query
        name: constituent
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters results based on the Constituent ID for the interaction.
      - in: query
        name: id
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters results based on the ID for the interaction.
      - in: query
        name: orderBy
        schema:
          type: string
          enum:
          - CreatedDate
          - Date
          - LastModifiedDate
        description: Sorts by Date, CreatedDate, or LastModifiedDate (default Date).
      - in: query
        name: orderDirection
        schema:
          type: string
          enum:
          - Asc
          - Desc
        description: Sorts the orderBy in ascending or descending order.
      responses:
        '200':
          description: The list of interactions that met the specified filters.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                        - properties:
                            Date:
                              type: string
                              format: date
                            Note:
                              type: string
                            Channel:
                              type: string
                              enum:
                              - Email
                              - MassEmail
                              - Phone
                              - TextMessage
                              - Mail
                              - InPerson
                              - SocialMedia
                              - Website
                              - Twitter
                              - Other
                              - EngagementSurveyEmail
                              - EngagementSurvey
                            Purpose:
                              type: string
                              enum:
                              - Acknowledgement
                              - ImpactCultivation
                              - Newsletter
                              - Receipt
                              - Solicitation
                              - SpecialEvent
                              - VolunteerActivity
                              - PledgeReminder
                              - Welcome
                              - BenevonPointOfEntry
                              - BenevonFollowUp
                              - BenevonAskEvent
                              - BenevonOneOnOneAsk
                              - BenevonOngoingCultivation
                              - Other
                            Subject:
                              type: string
                            IsInbound:
                              type: boolean
                        - type: object
                          properties:
                            AccountId:
                              type: integer
                              format: int64
                              description: The ID of the constituent used in the API (not to be confused with accountNumber)
                            TweetId:
                              type: string
                              description: If the Channel is Twitter, this contains the ID of the tweet that can be used to display the tweet by substituting into https://twitter.com/anyUser/status/{TweetId}
                            IsBcc:
                              type: boolean
                              description: Whether or not this interaction was created by an email that was sent to Bloomerang via BCC
                            EmailAddress:
                              type: string
                              format: email
                              description: If the interaction is an email interaction, this is the email address of the constituent that received the email. Only populated when IsBcc is true.
                            AttachmentIds:
                              type: array
                              items:
                                type: integer
                                format: int64
                                description: The ID of the attachments on this interaction
                            LetterAttachmentIds:
                              type: array
                              items:
                                type: integer
                                format: int64
                                description: The ID of generated letter attachments on this interaction.
                            SurveyLapsedResponses:
                              type: array
                              items:
                                type: string
                                description: The list of reasons the donor lapsed, if this interaction represents a lapsed donor survey response
                            IsEngagementSurveyResponse:
                              type: boolean
                              description: Whether this interaction represents a donor survey response
                            SurveyEmailInteractionId:
                              type: integer
                              format: int64
                              description: The interaction ID of the survey email that was sent to the donor.  Only populated when IsEngagementSurveyResponse is true
                            IsEngagementSurveyEmail:
                              type: boolean
                              description: Whether this interaction represents a survey email that was sent to the donor
                            SurveyResponseInteractionId:
                              type: integer
                              format: int64
                              description: The interaction ID of the survey response.  Only populated when IsEngagementSurveyEmail is true.
                            CustomValues:
                              type: array
                              items:
                                oneOf:
                                - properties:
                                    FieldId:
                                      type: integer
                                      format: int64
                                    FieldText:
                                      type: string
                                      description: The label/text of the custom field
                                    Value:
                                      properties:
                                        Id:
                                          type: integer
                                          format: int64
                                        Value:
                                          type: string
                                - properties:
                                    FieldId:
                                      type: integer
                                      format: int64
                                    FieldText:
                                      type: string
                                      description: The label/text of the custom field
                                    Values:
                                      type: array
                                      items:
                                        properties:
                                          Id:
                                            type: integer
                                            format: int64
                                          Value:
                                            type: string
                            AuditTrail:
                              properties:
                                CreatedDate:
                                  type: string
                                  format: date-time
                                CreatedName:
                                  type: string
                                LastModifiedDate:
                                  type: string
                                  format: date-time
                                LastModifiedName:
                                  type: string
      operationId: getInteractions
      x-operation-id-source: derived
  /interaction:
    post:
      tags:
      - Interactions
      summary: Creates an interaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
