                    format: int64
                    description: The ID of the constituent used in the API (not to be confused with accountNumber)
              - allOf:
                - properties:
                    Date:
                      type: string
                      format: date
                    Note:
                      type: string
                    Channel:
                      type: string
                      enum:
                      - Email
                      - MassEmail
                      - Phone
                      - TextMessage
                      - Mail
                      - InPerson
                      - SocialMedia
                      - Website
                      - Twitter
                      - Other
                      - EngagementSurveyEmail
                      - EngagementSurvey
                    Purpose:
