  /constituent/merge:
    post:
      tags:
      - Constituents
      summary: Creates a new constituent or merges data with an existing constituent
      description: When merging, the database will look for a possible duplicate defined as a name plus one piece of contact info (address, email, or phone). If a duplicate is found, the data passed in will be merged into an existing constituent. If no duplicate is found, a new constituent will be created. Note that this endpoint does not accept SecondaryAddresses, SecondaryEmails, or SecondaryPhones and you will receive an exception if you pass those in..
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Additional validation note - passing in SecondaryAddresses, SecondaryEmails, or SecondaryPhones will throw an exception.
              allOf:
              - properties:
                  Type:
                    type: string
                    enum:
                    - Individual
                    - Organization
                  Status:
                    type: string
                    enum:
                    - Active
                    - Inactive
                    - Deceased
                  FirstName:
                    type: string
                  LastName:
                    type: string
                  MiddleName:
                    type: string
                  Prefix:
                    type: string
                    description: Must match a prefix in the Bloomerang CRM
                  Suffix:
                    type: string
                    description: Must match a suffix in the Bloomerang CRM
                  FullName:
                    type: string
                  InformalName:
                    type: string
                  FormalName:
                    type: string
                  EnvelopeName:
                    type: string
                  RecognitionName:
                    type: string
                  JobTitle:
                    type: string
                  Employer:
                    type: string
                  Website:
                    type: string
                    format: uri
                  FacebookId:
                    type: string
                  TwitterId:
                    type: string
                  LinkedInId:
                    type: string
                  Gender:
                    type: string
                    enum:
                    - Male
                    - Female
                    - Other
                  Birthdate:
                    type: string
                    format: date
                  ProfilePictureType:
                    type: string
                    enum:
                    - None
                    - Custom
                    - Twitter
              - type: object
                properties:
                  PrimaryAddress:
                    type: object
                    properties:
                      Id:
                        type: integer
                        format: int64
                      AccountId:
                        type: integer
                        format: int64
                        description: The ID of the constituent used in the API (not to be confused with accountNumber)
                      Type:
                        type: string
                        enum:
                        - Home
                        - Vacation
                        - Work
                      Street:
                        type: string
                      City:
                        type: string
                      State:
                        type: string
                        description: Must match a state in the Bloomerang CRM
                      PostalCode:
                        type: string
                      Country:
                        type: string
                        description: Must match a state in the Bloomerang CRM
                      IsPrimary:
                        type: boolean
                      IsBad:
                        type: boolean
                  PrimaryEmail:
                    type: object
                    properties:
                      Id:
                        type: integer
                        format: int64
                      AccountId:
                        type: integer
                        format: int64
                        description: The ID of the constituent used in the API (not to be confused with accountNumber)
                      Type:
                        type: string
                        enum:
                        - Home
                        - Work
                      Value:
                        type: string
                        format: email
                        description: The email address
                      IsPrimary:
                        type: boolean
                      IsBad:
                        type: boolean
                  PrimaryPhone:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AccountId:
                          type: integer
                          format: int64
                          description: The ID of the constituent used in the API (not to be confused with accountNumber)
                        Type:
                          type: string
                          enum:
                          - Home
                          - Work
                          - Mobile
                          - Fax
                        Extension:
                          type: string
                        Number:
                          type: string
                          format: phone
                          description: The phone number including formatting but not the extension
                        IsPrimary:
                          type: boolean
                    properties:
                      AuditTrail:
                        properties:
                          CreatedDate:
                            type: string
                            format: date-time
                          CreatedName:
                            type: string
                          LastModifiedDate:
                            type: string
                            format: date-time
                          LastModifiedName:
                            type: string
                  FullCustomProfileImage:
                    items:
                      oneOf:
                      - allOf:
                        - properties:
                            Guid:
                              type: string
                              description: The GUID of the object uploaded to S3. This should be generated by the client that is uploading the file attachment.
                        - description: Validation notes - URL is required.  If creating attachments directly via the attachments endpoint (as opposed to including them a nested objects within other models), ParentType and ParentId are required.
                          properties:
                            Name:
                              type: string
                              description: User-friendly file name without the extension.
                            Extension:
                              type: string
                              description: No dot needed (use "txt" instead of ".txt"). May be null if the attachment is just a URL.
                    description: The full picture File Attachment. Note that a Constituent can only have one Profile Picture; adding a new one will remove the old one.
                  CroppedCustomProfileImage:
                    items:
                      oneOf:
                      - allOf:
                        - properties:
                            Guid:
                              type: string
                              description: The GUID of the object uploaded to S3. This should be generated by the client that is uploading the file attachment.
                        - description: Validation notes - URL is required.  If creating attachments directly via the attachments endpoint (as opposed to including them a nested objects within other models), ParentType and ParentId are required.
                          properties:
                            Name:
                              type: string
                              description: User-friendly file name without the extension.
                            Extension:
                              type: string
                              description: No dot needed (use "txt" instead of ".txt"). May be null if the attachment is just a URL.
                    description: The cropped picture File Attachment. Note that a Constituent can only have one Profile Picture; adding a new one will remove the old one.
                  CustomValues:
                    type: array
                    items:
                      oneOf:
                      - properties:
                          FieldId:
                            type: integer
                            format: int64
