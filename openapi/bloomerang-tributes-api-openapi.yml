openapi: 3.2.0
info:
  title: Bloomerang Tributes API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Tributes
paths:
  /tributes:
    get:
      tags:
      - Tributes
      summary: Gets a list of tributes
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters to tributes with the IDs in the list (pipe-separated)
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Filters to either active or inactive tributes
      responses:
        '200':
          description: The list of tributes that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                            SortIndex:
                              type: integer
                              format: int32
                        - allOf:
                          - type: object
                            properties:
                              Note:
                                type: string
                              TributeType:
                                type: string
                                enum:
                                - InHonorOf
                                - InMemoryOf
                              NotificantAccountIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of all notificants (constituents) associated with this tribute
                          - properties:
                              Name:
                                type: string
                              IsDefault:
                                type: boolean
                                description: Is this the default?
                              IsActive:
                                type: boolean
                                description: Is this active?
      operationId: getTributes
      x-operation-id-source: derived
  /tribute:
    post:
      tags:
      - Tributes
      summary: Creates a tribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - type: object
                  properties:
                    Note:
                      type: string
                    TributeType:
                      type: string
                      enum:
                      - InHonorOf
                      - InMemoryOf
                    NotificantAccountIds:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: The IDs of all notificants (constituents) associated with this tribute
                - properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                      description: Is this the default?
                    IsActive:
                      type: boolean
                      description: Is this active?
              required:
              - Name
              - TributeType
      responses:
        '200':
          description: The tribute with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    SortIndex:
                      type: integer
                      format: int32
                - allOf:
                  - type: object
                    properties:
                      Note:
                        type: string
                      TributeType:
                        type: string
                        enum:
                        - InHonorOf
                        - InMemoryOf
                      NotificantAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all notificants (constituents) associated with this tribute
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: postTribute
      x-operation-id-source: derived
  /tribute/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the tribute to return.
    get:
      tags:
      - Tributes
      summary: Gets a tribute by ID
      responses:
        '200':
          description: The tribute with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    SortIndex:
                      type: integer
                      format: int32
                - allOf:
                  - type: object
                    properties:
                      Note:
                        type: string
                      TributeType:
                        type: string
                        enum:
                        - InHonorOf
                        - InMemoryOf
                      NotificantAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all notificants (constituents) associated with this tribute
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: getTributeById
      x-operation-id-source: derived
    put:
      tags:
      - Tributes
      summary: Edits a tribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
              - allOf:
                - type: object
                  properties:
                    Note:
                      type: string
                    TributeType:
                      type: string
                      enum:
                      - InHonorOf
                      - InMemoryOf
                    NotificantAccountIds:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: The IDs of all notificants (constituents) associated with this tribute
                - properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                      description: Is this the default?
                    IsActive:
                      type: boolean
                      description: Is this active?
              required:
              - Id
      responses:
        '200':
          description: The tribute with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    SortIndex:
                      type: integer
                      format: int32
                - allOf:
                  - type: object
                    properties:
                      Note:
                        type: string
                      TributeType:
                        type: string
                        enum:
                        - InHonorOf
                        - InMemoryOf
                      NotificantAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all notificants (constituents) associated with this tribute
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: putTributeById
      x-operation-id-source: derived
  /tributes/search:
    get:
      tags:
      - Tributes
      summary: Searches for active tributes
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: search
        schema:
          type: string
        description: The text to search (must be at least 3 characters)
      responses:
        '200':
          description: The list of tributes that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                            SortIndex:
                              type: integer
                              format: int32
                        - allOf:
                          - type: object
                            properties:
                              Note:
                                type: string
                              TributeType:
                                type: string
                                enum:
                                - InHonorOf
                                - InMemoryOf
                              NotificantAccountIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of all notificants (constituents) associated with this tribute
                          - properties:
                              Name:
                                type: string
                              IsDefault:
                                type: boolean
                                description: Is this the default?
                              IsActive:
                                type: boolean
                                description: Is this active?
      operationId: getTributesSearch
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth 2 with the authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://crm.bloomerang.com/authorize/
          tokenUrl: https://api.bloomerang.co/v2/oauth/token
          refreshUrl: https://api.bloomerang.co/v2/oauth/token
          scopes:
            ViewOnly: Base level view-only privileges
            StandardEditFinancialData: Base level privileges and ability to edit financial data
            Standard: Same privileges as a standard user (includes transaction edit)
            OrgAdmin: Privileges of an Organization Administrator
externalDocs:
  url: https://www.bloomerang.com/openapi_errorcodes.html
  description: Error Codes
x-provenance:
  method: harvested
  publisher: Bloomerang
  source: https://bloomerang-api-documentation.s3.us-west-2.amazonaws.com/public_crm_generated.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
