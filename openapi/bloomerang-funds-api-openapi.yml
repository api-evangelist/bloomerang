openapi: 3.2.0
info:
  title: Bloomerang Funds API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Funds
paths:
  /funds:
    get:
      tags:
      - Funds
      summary: Gets a list of funds
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters to funds with the IDs in the list (pipe-separated)
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Filters to either active or inactive funds
      - in: query
        name: isDefault
        schema:
          type: boolean
        description: Filters to either default or non-default funds
      - in: query
        name: search
        schema:
          type: string
        description: Filters to funds with names that match any part of the search string
      responses:
        '200':
          description: The list of funds that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                        - allOf:
                          - type: object
                            properties:
                              GeneralLedgerClass:
                                type: string
                                description: The class label for this fund in the general ledger (quickbooks)
                              DefaultQuickbooksAccountId:
                                type: integer
                                format: int64
                                description: The ID of the general ledger (quickbooks) account to which this fund will default
                              QuickbooksAccountIds:
                                type: array
                                items:
                                  type: integer
                                  format: int64
                                description: The IDs of all general ledger (quickbooks) accounts associated with this fund
                        - allOf:
                          - type: object
                            properties:
                              SortIndex:
                                type: integer
                                format: int32
                          - properties:
                              Name:
                                type: string
                              IsDefault:
                                type: boolean
                                description: Is this the default?
                              IsActive:
                                type: boolean
                                description: Is this active?
      operationId: getFunds
      x-operation-id-source: derived
  /fund:
    post:
      tags:
      - Funds
      summary: Creates a fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
              - allOf:
                - type: object
                  properties:
                    GeneralLedgerClass:
                      type: string
                      description: The class label for this fund in the general ledger (quickbooks)
                    DefaultQuickbooksAccountId:
                      type: integer
                      format: int64
                      description: The ID of the general ledger (quickbooks) account to which this fund will default
                    QuickbooksAccountIds:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: The IDs of all general ledger (quickbooks) accounts associated with this fund
              - allOf:
                - type: object
                  properties:
                    SortIndex:
                      type: integer
                      format: int32
                - properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                      description: Is this the default?
                    IsActive:
                      type: boolean
                      description: Is this active?
              required:
              - Name
      responses:
        '200':
          description: The fund was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - allOf:
                  - type: object
                    properties:
                      GeneralLedgerClass:
                        type: string
                        description: The class label for this fund in the general ledger (quickbooks)
                      DefaultQuickbooksAccountId:
                        type: integer
                        format: int64
                        description: The ID of the general ledger (quickbooks) account to which this fund will default
                      QuickbooksAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all general ledger (quickbooks) accounts associated with this fund
                - allOf:
                  - type: object
                    properties:
                      SortIndex:
                        type: integer
                        format: int32
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: postFund
      x-operation-id-source: derived
  /fund/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the fund to return.
    get:
      tags:
      - Funds
      summary: Gets a fund by ID
      responses:
        '200':
          description: The fund with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - allOf:
                  - type: object
                    properties:
                      GeneralLedgerClass:
                        type: string
                        description: The class label for this fund in the general ledger (quickbooks)
                      DefaultQuickbooksAccountId:
                        type: integer
                        format: int64
                        description: The ID of the general ledger (quickbooks) account to which this fund will default
                      QuickbooksAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all general ledger (quickbooks) accounts associated with this fund
                - allOf:
                  - type: object
                    properties:
                      SortIndex:
                        type: integer
                        format: int32
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: getFundById
      x-operation-id-source: derived
    put:
      tags:
      - Funds
      summary: Updates a fund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
                    format: int64
              - allOf:
                - type: object
                  properties:
                    GeneralLedgerClass:
                      type: string
                      description: The class label for this fund in the general ledger (quickbooks)
                    DefaultQuickbooksAccountId:
                      type: integer
                      format: int64
                      description: The ID of the general ledger (quickbooks) account to which this fund will default
                    QuickbooksAccountIds:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: The IDs of all general ledger (quickbooks) accounts associated with this fund
              - allOf:
                - type: object
                  properties:
                    SortIndex:
                      type: integer
                      format: int32
                - properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                      description: Is this the default?
                    IsActive:
                      type: boolean
                      description: Is this active?
      responses:
        '200':
          description: The fund with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - allOf:
                  - type: object
                    properties:
                      GeneralLedgerClass:
                        type: string
                        description: The class label for this fund in the general ledger (quickbooks)
                      DefaultQuickbooksAccountId:
                        type: integer
                        format: int64
                        description: The ID of the general ledger (quickbooks) account to which this fund will default
                      QuickbooksAccountIds:
                        type: array
                        items:
                          type: integer
                          format: int64
                        description: The IDs of all general ledger (quickbooks) accounts associated with this fund
                - allOf:
                  - type: object
                    properties:
                      SortIndex:
                        type: integer
                        format: int32
                  - properties:
                      Name:
                        type: string
                      IsDefault:
                        type: boolean
                        description: Is this the default?
                      IsActive:
                        type: boolean
                        description: Is this active?
      operationId: putFundById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth 2 with the authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://crm.bloomerang.com/authorize/
          tokenUrl: https://api.bloomerang.co/v2/oauth/token
          refreshUrl: https://api.bloomerang.co/v2/oauth/token
          scopes:
            ViewOnly: Base level view-only privileges
            StandardEditFinancialData: Base level privileges and ability to edit financial data
            Standard: Same privileges as a standard user (includes transaction edit)
            OrgAdmin: Privileges of an Organization Administrator
externalDocs:
  url: https://www.bloomerang.com/openapi_errorcodes.html
  description: Error Codes
