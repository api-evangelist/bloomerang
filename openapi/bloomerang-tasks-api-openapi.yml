                      - ImpactCultivation
                      - Newsletter
                      - Receipt
                      - Solicitation
                      - SpecialEvent
                      - VolunteerActivity
                      - PledgeReminder
                      - Welcome
                      - BenevonPointOfEntry
                      - BenevonFollowUp
