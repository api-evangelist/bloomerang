    delete:
      tags:
      - Tasks
      summary: Deletes a task
      responses:
        '200':
          description: The task was deleted successfully.
          content:
            application/json:
              schema:
                properties:
                  Id:
                    type: integer
                    description: The ID of the object that was deleted
                    format: int64
                  Type:
                    type: string
                    description: The type of object that was deleted
                  Deleted:
                    type: boolean
                    description: True if the object was deleted
      operationId: deleteTaskById
      x-operation-id-source: derived
  /task/{id}/complete:
    put:
      tags:
      - Tasks
      summary: Completes a task
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
        description: The task ID
      - in: query
        name: saveAsInteraction
        schema:
          type: boolean
          default: true
        description: True to create an interaction from the task; must be false if the task does not have a constituent
      - in: query
        name: completedDate
        schema:
          type: string
          format: date
          default: today
        description: The date the task is completed
      responses:
        '200':
          description: The task was completed.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId:
                      type: integer
                      format: int64
                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                    Status:
