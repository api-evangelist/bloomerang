openapi: 3.2.0
info:
  title: Bloomerang Phones API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Phones
paths:
  /phones:
    get:
      tags:
      - Phones
      summary: Gets a list of phones
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: constituent
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters results based on the Constituent ID for the phone.
      - in: query
        name: id
        style: pipeDelimited
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters results based on the ID for the phone.
      responses:
        '200':
          description: The list of phones that met the specified filters.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                            AccountId:
                              type: integer
                              format: int64
                              description: The ID of the constituent used in the API (not to be confused with accountNumber)
                            Type:
                              type: string
                              enum:
                              - Home
                              - Work
                              - Mobile
                              - Fax
                            Extension:
                              type: string
                            Number:
                              type: string
                              format: phone
                              description: The phone number including formatting but not the extension
                            IsPrimary:
                              type: boolean
                        properties:
                          AuditTrail:
                            properties:
                              CreatedDate:
                                type: string
                                format: date-time
                              CreatedName:
                                type: string
                              LastModifiedDate:
                                type: string
                                format: date-time
                              LastModifiedName:
                                type: string
      operationId: getPhones
      x-operation-id-source: derived
  /phone:
    post:
      tags:
      - Phones
      summary: Creates a phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
                    format: int64
                  AccountId:
                    type: integer
                    format: int64
                    description: The ID of the constituent used in the API (not to be confused with accountNumber)
                  Type:
                    type: string
                    enum:
                    - Home
                    - Work
                    - Mobile
                    - Fax
                  Extension:
                    type: string
                  Number:
                    type: string
                    format: phone
                    description: The phone number including formatting but not the extension
                  IsPrimary:
                    type: boolean
              required:
              - Type
              - Number
      responses:
        '200':
          description: The phone was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId:
                      type: integer
                      format: int64
                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                    Type:
                      type: string
                      enum:
                      - Home
                      - Work
                      - Mobile
                      - Fax
                    Extension:
                      type: string
                    Number:
                      type: string
                      format: phone
                      description: The phone number including formatting but not the extension
                    IsPrimary:
                      type: boolean
                properties:
                  AuditTrail:
                    properties:
                      CreatedDate:
                        type: string
                        format: date-time
                      CreatedName:
                        type: string
                      LastModifiedDate:
                        type: string
                        format: date-time
                      LastModifiedName:
                        type: string
      operationId: postPhone
      x-operation-id-source: derived
  /phone/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the phone to return.
    get:
      tags:
      - Phones
      summary: Gets a phone by ID
      responses:
        '200':
          description: The phone with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId:
                      type: integer
                      format: int64
                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                    Type:
                      type: string
                      enum:
                      - Home
                      - Work
                      - Mobile
                      - Fax
                    Extension:
                      type: string
                    Number:
                      type: string
                      format: phone
                      description: The phone number including formatting but not the extension
                    IsPrimary:
                      type: boolean
                properties:
                  AuditTrail:
                    properties:
                      CreatedDate:
                        type: string
                        format: date-time
                      CreatedName:
                        type: string
                      LastModifiedDate:
                        type: string
                        format: date-time
                      LastModifiedName:
                        type: string
      operationId: getPhoneById
      x-operation-id-source: derived
    put:
      tags:
      - Phones
      summary: Updates a phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
                    format: int64
                  AccountId:
                    type: integer
                    format: int64
                    description: The ID of the constituent used in the API (not to be confused with accountNumber)
                  Type:
                    type: string
                    enum:
                    - Home
                    - Work
                    - Mobile
                    - Fax
                  Extension:
                    type: string
                  Number:
                    type: string
                    format: phone
                    description: The phone number including formatting but not the extension
                  IsPrimary:
                    type: boolean
              properties:
                AuditTrail:
                  properties:
                    CreatedDate:
                      type: string
                      format: date-time
                    CreatedName:
                      type: string
                    LastModifiedDate:
                      type: string
                      format: date-time
                    LastModifiedName:
                      type: string
      responses:
        '200':
          description: The phone was updated successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId:
                      type: integer
                      format: int64
                      description: The ID of the constituent used in the API (not to be confused with accountNumber)
                    Type:
                      type: string
                      enum:
                      - Home
                      - Work
                      - Mobile
                      - Fax
                    Extension:
                      type: string
                    Number:
                      type: string
                      format: phone
                      description: The phone number including formatting but not the extension
                    IsPrimary:
                      type: boolean
                properties:
                  AuditTrail:
                    properties:
                      CreatedDate:
                        type: string
                        format: date-time
                      CreatedName:
                        type: string
                      LastModifiedDate:
                        type: string
                        format: date-time
                      LastModifiedName:
                        type: string
      operationId: putPhoneById
      x-operation-id-source: derived
    delete:
      tags:
      - Phones
      summary: Deletes a phone
      responses:
        '200':
          description: The phone was deleted successfully.
          content:
            application/json:
              schema:
                properties:
                  Id:
                    type: integer
                    description: The ID of the object that was deleted
                    format: int64
                  Type:
                    type: string
                    description: The type of object that was deleted
                  Deleted:
                    type: boolean
                    description: True if the object was deleted
      operationId: deletePhoneById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth 2 with the authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://crm.bloomerang.com/authorize/
          tokenUrl: https://api.bloomerang.co/v2/oauth/token
          refreshUrl: https://api.bloomerang.co/v2/oauth/token
          scopes:
            ViewOnly: Base level view-only privileges
            StandardEditFinancialData: Base level privileges and ability to edit financial data
            Standard: Same privileges as a standard user (includes transaction edit)
            OrgAdmin: Privileges of an Organization Administrator
externalDocs:
  url: https://www.bloomerang.com/openapi_errorcodes.html
  description: Error Codes
