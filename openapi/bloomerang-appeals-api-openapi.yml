openapi: 3.2.0
info:
  title: Bloomerang Appeals API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Appeals
paths:
  /appeals:
    get:
      tags:
      - Appeals
      summary: Gets a list of appeals
      parameters:
      - in: query
        name: skip
        schema:
          type: integer
          minimum: 0
          default: 0
        description: The number of items to skip before starting to collect the result set.
      - in: query
        name: take
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
        description: The number of items to include in the result set.
      - in: query
        name: lastModified
        schema:
          type: string
          format: date-time
        description: Filters to appeals last modified after the specified date
      - in: query
        name: id
        schema:
          type: array
          items:
            type: integer
            format: int64
        description: Filters to appeals with the IDs in the list (pipe-separated)
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Filters to either active or inactive appeals
      - in: query
        name: search
        schema:
          type: string
        description: Filters to appeals with names that match any part of the search string
      responses:
        '200':
          description: The list of appeals that met the search criteria.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Total:
                      type: integer
                      description: The total number of records in Bloomerang.
                    TotalFiltered:
                      type: integer
                      description: The total number of records that match the filters.
                    Start:
                      type: integer
                      description: The 0-based index of the first record.
                    ResultCount:
                      type: integer
                      description: The number of records included in the result set.
                - type: object
                  properties:
                    Results:
                      type: array
                      items:
                        allOf:
                        - type: object
                          properties:
                            Id:
                              type: integer
                              format: int64
                        - properties:
                            Name:
                              type: string
                            SortIndex:
                              type: integer
                              format: int32
                            IsActive:
                              type: boolean
                              description: Is this active?
                        - type: object
                          properties:
                            AuditTrail:
                              properties:
                                CreatedDate:
                                  type: string
                                  format: date-time
                                CreatedName:
                                  type: string
                                LastModifiedDate:
                                  type: string
                                  format: date-time
                                LastModifiedName:
                                  type: string
      operationId: getAppeals
      x-operation-id-source: derived
  /appeal:
    post:
      tags:
      - Appeals
      summary: Creates an appeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
              - properties:
                  Name:
                    type: string
                  IsActive:
                    type: boolean
                    description: Is this active?
                  SortIndex:
                    type: integer
                    format: int32
              required:
              - Name
      responses:
        '200':
          description: The appeal was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - properties:
                    Name:
                      type: string
                    SortIndex:
                      type: integer
                      format: int32
                    IsActive:
                      type: boolean
                      description: Is this active?
                - type: object
                  properties:
                    AuditTrail:
                      properties:
                        CreatedDate:
                          type: string
                          format: date-time
                        CreatedName:
                          type: string
                        LastModifiedDate:
                          type: string
                          format: date-time
                        LastModifiedName:
                          type: string
      operationId: postAppeal
      x-operation-id-source: derived
  /appeal/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the appeal to return.
    get:
      tags:
      - Appeals
      summary: Gets a appeal by ID
      responses:
        '200':
          description: The appeal with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - properties:
                    Name:
                      type: string
                    SortIndex:
                      type: integer
                      format: int32
                    IsActive:
                      type: boolean
                      description: Is this active?
                - type: object
                  properties:
                    AuditTrail:
                      properties:
                        CreatedDate:
                          type: string
                          format: date-time
                        CreatedName:
                          type: string
                        LastModifiedDate:
                          type: string
                          format: date-time
                        LastModifiedName:
                          type: string
      operationId: getAppealById
      x-operation-id-source: derived
    put:
      tags:
      - Appeals
      summary: Updates an appeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  Id:
                    type: integer
                    format: int64
              - properties:
                  Name:
                    type: string
                  IsActive:
                    type: boolean
                    description: Is this active?
                  SortIndex:
                    type: integer
                    format: int32
      responses:
        '200':
          description: The appeal with the given ID.
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    Id:
                      type: integer
                      format: int64
                - properties:
                    Name:
                      type: string
                    SortIndex:
                      type: integer
                      format: int32
                    IsActive:
                      type: boolean
                      description: Is this active?
                - type: object
                  properties:
                    AuditTrail:
                      properties:
                        CreatedDate:
                          type: string
                          format: date-time
                        CreatedName:
                          type: string
                        LastModifiedDate:
                          type: string
                          format: date-time
                        LastModifiedName:
                          type: string
      operationId: putAppealById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth 2 with the authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://crm.bloomerang.com/authorize/
          tokenUrl: https://api.bloomerang.co/v2/oauth/token
          refreshUrl: https://api.bloomerang.co/v2/oauth/token
          scopes:
            ViewOnly: Base level view-only privileges
            StandardEditFinancialData: Base level privileges and ability to edit financial data
            Standard: Same privileges as a standard user (includes transaction edit)
            OrgAdmin: Privileges of an Organization Administrator
externalDocs:
  url: https://www.bloomerang.com/openapi_errorcodes.html
  description: Error Codes
x-provenance:
  method: harvested
  publisher: Bloomerang
  source: https://bloomerang-api-documentation.s3.us-west-2.amazonaws.com/public_crm_generated.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
