openapi: 3.2.0
info:
  title: Bloomerang Relationships API
  description: Private-key API for Bloomerang CRM
  version: 2.0.0
  contact:
    name: Bloomerang
    url: https://www.bloomerang.com/
    email: support@bloomerang.com
servers:
- url: https://api.bloomerang.co/v2
security:
- ApiKeyAuth: []
- OAuth2: []
tags:
- name: Relationships
paths:
  /relationship:
    post:
      tags:
      - Relationships
      summary: Creates a Relationship between two non-household Constituents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId1:
                      type: integer
                      format: int64
                    AccountId2:
                      type: integer
                      format: int64
                    Note:
                      type: string
                properties:
                  RelationshipRoleId1:
                    type: integer
                    format: int64
                  RelationshipRoleId2:
                    type: integer
                    format: int64
              required:
              - AccountId1
              - AccountId2
              - RelationshipRoleId1
              - RelationshipRoleId2
      responses:
        '200':
          description: The relationship was created successfully.
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId1:
                      type: integer
                      format: int64
                    AccountId2:
                      type: integer
                      format: int64
                    Note:
                      type: string
                properties:
                  RelationshipRole1:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
                  RelationshipRole2:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
      operationId: postRelationship
      x-operation-id-source: derived
  /relationship/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The ID of the relationship
    get:
      tags:
      - Relationships
      summary: Gets a relationship
      responses:
        '200':
          description: The Relationship that was found
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId1:
                      type: integer
                      format: int64
                    AccountId2:
                      type: integer
                      format: int64
                    Note:
                      type: string
                properties:
                  RelationshipRole1:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
                  RelationshipRole2:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
      operationId: getRelationshipById
      x-operation-id-source: derived
    put:
      tags:
      - Relationships
      summary: Updates a relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - allOf:
                - properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId1:
                      type: integer
                      format: int64
                    AccountId2:
                      type: integer
                      format: int64
                    Note:
                      type: string
                properties:
                  RelationshipRoleId1:
                    type: integer
                    format: int64
                  RelationshipRoleId2:
                    type: integer
                    format: int64
              required:
              - Id
      responses:
        '200':
          description: The Relationship was updated
          content:
            application/json:
              schema:
                allOf:
                - properties:
                    Id:
                      type: integer
                      format: int64
                    AccountId1:
                      type: integer
                      format: int64
                    AccountId2:
                      type: integer
                      format: int64
                    Note:
                      type: string
                properties:
                  RelationshipRole1:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
                  RelationshipRole2:
                    allOf:
                    - type: object
                      properties:
                        Id:
                          type: integer
                          format: int64
                        AuditTrail:
                          properties:
                            CreatedDate:
                              type: string
                              format: date-time
                            CreatedName:
                              type: string
                            LastModifiedDate:
                              type: string
                              format: date-time
                            LastModifiedName:
                              type: string
                    - allOf:
                      - type: object
                        properties:
                          SortIndex:
                            type: integer
                            format: int32
                      - properties:
                          Name:
                            type: string
                          IsDefault:
                            type: boolean
                            description: Is this the default?
                          IsActive:
                            type: boolean
                            description: Is this active?
      operationId: putRelationshipById
      x-operation-id-source: derived
    delete:
      tags:
      - Relationships
      summary: Deletes a Relationship
      responses:
        '201':
          description: The relationship was deleted successfully.
          content:
            application/json:
              schema:
                properties:
                  Id:
                    type: integer
                    description: The ID of the object that was deleted
                    format: int64
                  Type:
                    type: string
                    description: The type of object that was deleted
                  Deleted:
                    type: boolean
                    description: True if the object was deleted
      operationId: deleteRelationshipById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
    OAuth2:
      type: oauth2
      description: OAuth 2 with the authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://crm.bloomerang.com/authorize/
          tokenUrl: https://api.bloomerang.co/v2/oauth/token
          refreshUrl: https://api.bloomerang.co/v2/oauth/token
          scopes:
            ViewOnly: Base level view-only privileges
            StandardEditFinancialData: Base level privileges and ability to edit financial data
            Standard: Same privileges as a standard user (includes transaction edit)
            OrgAdmin: Privileges of an Organization Administrator
externalDocs:
  url: https://www.bloomerang.com/openapi_errorcodes.html
  description: Error Codes
